[package]
name = "rtime"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"   
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
] }
